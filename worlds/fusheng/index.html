<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>浮生 · 人生模拟</title>
  <meta name="description" content="按真实统计数据投胎，把这一生过到最后。数据来自 Our World in Data。">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <!-- data-URI favicon：不让浏览器去请求 /favicon.ico 打出 404（与主页同款防御） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%BE%3C/text%3E%3C/svg%3E">
  <!-- 字体异步：media=print 加载完成后切 all（契约 §4 思路），不阻塞首屏、不占构建预算 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
  </noscript>
</head>
<body>
  <!-- world.json 加载门生效期间的静态占位（React 挂载后自然替换） -->
  <div id="root"><p style="margin:2rem auto;width:max-content;font-size:15px;opacity:.7">命运装订中……</p></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- 全站公告（hub 下发，Shadow DOM 隔离） -->
  <script src="/nt/notice.js" defer></script>
</body>
</html>
